# =============================================================================
# FairCLIP — Local Dataset Paths
# =============================================================================
# THIS IS THE ONLY FILE YOU NEED TO EDIT to point at your datasets.
# Replace the placeholder paths below with the actual locations on your machine.
#
# Each dataset has two fields:
#   root: the top-level directory containing the dataset
#   csv:  the manifest CSV that lists images + labels (built by prepare_*.py)
#
# After editing this file, run:
#   python -m data.verify_data
# to confirm every dataset is reachable and properly formatted.
# =============================================================================

# --- FairFace ---------------------------------------------------------------
# Expected structure:
#   <root>/
#     train/   (image .jpg files)
#     val/
#     fairface_label_train.csv   (downloaded from FairFace GitHub)
#     fairface_label_val.csv
fairface:
  root: "/path/to/your/fairface"          # <-- EDIT THIS
  manifest: "results/manifests/fairface.csv"   # auto-generated by prepare_fairface.py
  image_size: 224

# --- UTKFace ----------------------------------------------------------------
# Expected structure:
#   <root>/
#     UTKFace/   (folder with images named like 25_0_0_xxx.jpg)
# Filename format: [age]_[gender]_[race]_[date&time].jpg
utkface:
  root: "/path/to/your/utkface"           # <-- EDIT THIS
  manifest: "results/manifests/utkface.csv"
  image_size: 224

# --- COCO Captions ----------------------------------------------------------
# Expected structure (COCO 2017 layout):
#   <root>/
#     train2017/        (image folder)
#     val2017/
#     annotations/
#       captions_train2017.json
#       captions_val2017.json
coco:
  root: "/path/to/your/coco"              # <-- EDIT THIS
  manifest_train: "results/manifests/coco_train.csv"
  manifest_val: "results/manifests/coco_val.csv"
  image_size: 224

# --- FACET ------------------------------------------------------------------
# FACET is downloaded from https://facet.metademolab.com/
# Expected structure:
#   <root>/
#     images/
#     facet_attributes.csv
facet:
  root: "/path/to/your/facet"             # <-- EDIT THIS
  manifest: "results/manifests/facet.csv"
  image_size: 224

# --- Flickr30k --------------------------------------------------------------
# For retrieval evaluation. Optional but recommended for top-venue submission.
# Expected structure:
#   <root>/
#     flickr30k-images/   (images)
#     results_20130124.token   (5 captions per image)
flickr30k:
  root: "/path/to/your/flickr30k"         # <-- EDIT THIS
  manifest: "results/manifests/flickr30k.csv"
  image_size: 224
  enabled: false                           # set to true once you have it ready

# --- ImageNet validation set ------------------------------------------------
# We only need the val set (50k images) for zero-shot classification eval.
# Expected structure:
#   <root>/
#     val/
#       n01440764/  (1000 class folders, each with images)
#       n01443537/
#       ...
imagenet:
  root: "/path/to/your/imagenet/val"      # <-- EDIT THIS (point at the 'val' folder)
  manifest: "results/manifests/imagenet_val.csv"
  image_size: 224
  enabled: false                           # set to true once ready

# =============================================================================
# Output paths — leave these as-is unless you have a specific reason
# =============================================================================
output:
  checkpoints: "results/checkpoints"
  logs: "results/logs"
  tables: "results/tables"
  manifests: "results/manifests"
  figures: "results/figures"
